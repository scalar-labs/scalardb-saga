kind: bugfix
body: The ScalarDB Saga Server container image is now based on Scalar's managed JRE image, `ghcr.io/scalar-labs/jre25`, instead of `eclipse-temurin`. OS package security fixes now arrive with each update of that base image, rather than from an upgrade run while the server image is built.
