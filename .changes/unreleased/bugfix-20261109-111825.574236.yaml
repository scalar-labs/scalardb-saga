kind: bugfix
body: The ScalarDB Saga Server container image is now based on Eclipse Temurin 25.0.5_8, whose trust store no longer includes the emSign root CA that issued the compromised eMudhra intermediate CAs, so certificates issued through those intermediates are no longer trusted (CVE-2026-91403, CVE-2026-114820).
