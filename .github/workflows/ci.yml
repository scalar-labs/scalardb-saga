name: CI

# Version branches are covered as well as main: a release is cut from a minor version branch, and the
# commit that sets the release version plus every backport after it exist only there. Testing pull
# requests alone would leave every released commit unverified, since the merge result on the branch is
# not what the pull request built.
on:
  push:
    branches:
      - main
      - "[0-9]+"
      - "[0-9]+.[0-9]+"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # On a release-version commit the getting-started Compose default has to name the version being
      # released. `verify-version` refuses the tag otherwise, but by then the tag is already pushed,
      # so catching it here puts the failure in the pull request that sets the version — which is
      # where the omission happens, and what step 2 of RELEASING.md merges through a PR for.
      #
      # A snapshot version means an ordinary branch, where the default legitimately names the last
      # release rather than what this tree builds, so there is nothing to compare.
      - name: Check the getting-started Compose default on a release-version commit
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' gradle.properties)
          case "${version}" in
            *-SNAPSHOT)
              echo "::notice::${version} is a snapshot; the Compose default names the last release"
              exit 0
              ;;
          esac
          compose=getting-started/docker-compose.yaml
          # Single-quoted on purpose: sed must see the literal `${SAGA_VERSION:-` text, so the shell
          # must not expand it.
          # shellcheck disable=SC2016
          default=$(sed -n 's/.*scalardb-saga-server:${SAGA_VERSION:-\([^}]*\)}.*/\1/p' "${compose}")
          if [ -z "${default}" ]; then
            echo "::error::could not read the SAGA_VERSION default from ${compose}; the image line" \
              "no longer matches the expected \${SAGA_VERSION:-<version>} form"
            exit 1
          fi
          if [ "${default}" != "${version}" ]; then
            echo "::error::${compose} defaults SAGA_VERSION to ${default}, but gradle.properties" \
              "names release ${version}. Update the default in this pull request; the release" \
              "workflow refuses the tag otherwise."
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Check
        run: ./gradlew check

      - name: Check compiler warnings
        run: ./gradlew clean compileTestJava --no-build-cache

      # Keep the failing run's reports and result XML so a flake that doesn't reproduce is still
      # diagnosable. The warnings step's `clean` wipes build/, so a failure there has nothing to
      # upload; if-no-files-found tolerates that.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  dockerfile-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Lint the server Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: server/docker/Dockerfile

  # The unit and integration suites exercise the daemon in-process; nothing there would catch a
  # packaging fault — a wrong path in the Dockerfile, a start script that cannot find its jars, a file
  # unreadable by uid 201. Those only appear when the built image is actually run, and they would
  # otherwise be found by whoever pulled the release.
  image-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Assemble the Docker build context
        run: ./gradlew :server:dockerContext

      # The classified epoll natives are the only architecture-specific part of the distribution, and
      # only linux-x86_64 arrives transitively — a dropped linux-aarch_64 dependency leaves the arm64
      # image healthy and quiet on NIO, which no assertion against a running amd64 container can see.
      # The versions must match netty-transport-classes-epoll as well: the loader refuses a native
      # artifact whose version differs from the classes loading it, which fails the same silent way.
      - name: Check both epoll natives are packaged
        run: |
          set -euo pipefail
          lib=server/build/docker/dist/lib
          version=$(basename "$(ls "${lib}"/netty-transport-classes-epoll-*.jar)" .jar |
            sed 's/^netty-transport-classes-epoll-//')
          for classifier in linux-x86_64 linux-aarch_64; do
            jar="netty-transport-native-epoll-${version}-${classifier}.jar"
            if [ ! -f "${lib}/${jar}" ]; then
              echo "::error::${jar} is missing from the distribution"
              exit 1
            fi
          done

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Host architecture only, and loaded rather than pushed. Everything asserted below except the
      # epoll load is architecture-independent; the arm64 side is covered by the packaging check above
      # and by image-arm64-native-test. The release workflow is what builds both architectures.
      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: server/build/docker
          load: true
          tags: scalardb-saga-server:ci
          build-args: |
            IMAGE_VERSION=ci
            IMAGE_REVISION=${{ github.sha }}

      - name: Check the image runs as a non-root user
        run: |
          set -euo pipefail
          user=$(docker image inspect --format '{{.Config.User}}' scalardb-saga-server:ci)
          if [ "${user}" != "201:201" ]; then
            echo "::error::image runs as '${user}', expected 201:201"
            exit 1
          fi

      # The configuration is a checked-in fixture (.github/smoke), shared with image-arm64-native-test
      # so the two jobs cannot drift into booting differently configured daemons.
      - name: Start the container
        run: |
          docker run --detach --name saga \
            --publish 12080:12080 --publish 12051:12051 \
            --volume "$PWD/.github/smoke:/smoke:ro" \
            scalardb-saga-server:ci --config /smoke/server.properties

      - name: Wait for the REST health endpoint
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:12080/health)" = "200" ]; then
              echo "GET /health returned 200"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' saga)" != "true" ]; then
              echo "::error::container exited before becoming healthy"
              exit 1
            fi
            sleep 2
          done
          echo "::error::/health did not return 200 within 120s"
          exit 1

      # Packaging the native artifact is not the same as loading it: a version skew against
      # netty-common, or a jar the JVM cannot read, drops gRPC onto NIO with no warning and a healthy
      # /health. Netty unlinks the .so the moment it loads it, so /tmp shows nothing — the mapping in
      # the JVM's address space is the evidence, and it survives the unlink as "(deleted)". The JVM is
      # PID 1 here (the start script ends in `exec java`). The filename carries the architecture, so
      # this also catches a native artifact loaded for the wrong one.
      - name: Check the epoll native transport loaded
        run: |
          set -euo pipefail
          if ! docker exec saga grep -q libnetty_transport_native_epoll_x86_64 /proc/1/maps; then
            echo "::error::epoll native transport is not loaded; gRPC silently fell back to NIO"
            docker exec saga grep -o 'libnetty[a-z0-9_]*' /proc/1/maps || echo "no netty native mapped"
            exit 1
          fi

      # A TCP connect, not a gRPC call: this asserts the transport is bound and reachable in the
      # packaged image. The health service's actual semantics are covered by the server's
      # integrationTest suite, which needs no container.
      #
      # The redirect is `<`, not `>`: writing to the socket sends a byte that is not an HTTP/2 client
      # preface, and gRPC answers with an Http2Exception stack trace in the container logs — alarming
      # noise in CI output caused entirely by the probe. Opening for read establishes and closes the
      # connection without sending anything.
      - name: Check the gRPC port is bound
        # Block scalar because the command contains ": ", which YAML would otherwise read as a mapping.
        run: |
          timeout 30 bash -c 'until : < /dev/tcp/127.0.0.1/12051; do sleep 1; done'

      # Guards against a regression in the shipped logback.xml: with no configuration on the classpath
      # Logback would default to DEBUG, flooding an operator's log pipeline.
      - name: Check startup logging
        run: |
          set -euo pipefail
          logs=$(docker logs saga 2>&1)
          if ! grep -q "SagaServer started" <<<"${logs}"; then
            echo "::error::startup line missing from the container logs"
            exit 1
          fi
          if grep -q " DEBUG " <<<"${logs}"; then
            echo "::error::container logged at DEBUG; the default logback.xml is not being picked up"
            exit 1
          fi
          # A dropped --enable-native-access is the same class of silent degradation as an epoll
          # fallback: every other assertion here stays green while the JVM warns on each boot, and a
          # future release turns that warning into a blocked call.
          if grep -q "A restricted method in java.lang.System" <<<"${logs}"; then
            echo "::error::restricted-method warning at boot; --enable-native-access is missing from the start script"
            exit 1
          fi

      # SIGTERM must reach the JVM so SagaServer's shutdown hook drains in-flight sagas. If a wrapper
      # script swallowed the signal, the daemon would be SIGKILLed after the timeout instead.
      - name: Check graceful shutdown
        run: |
          set -euo pipefail
          docker stop --timeout 60 saga
          if ! docker logs saga 2>&1 | grep -q "SagaServer stopped"; then
            echo "::error::no clean shutdown line; SIGTERM did not reach the JVM"
            exit 1
          fi

      # --- TLS boot ---------------------------------------------------------------------------
      # The plaintext boot above proves the packaged image serves; this second boot proves the same
      # image serves TLS on both transports when the tls.* keys are set. The material is generated
      # here, never committed (committed keys expire and trip secret scanners), and the
      # configuration is the shared fixture plus only the tls.* delta, so the two boots cannot
      # drift apart. JDK SSL means nothing here is architecture-specific, so the arm64 job stays
      # plaintext-only.
      - name: Prepare the TLS boot fixture
        run: |
          set -euo pipefail
          mkdir -p smoke-tls
          cp -R .github/smoke/. smoke-tls/
          openssl req -x509 -newkey rsa:2048 -noenc -days 2 \
            -keyout smoke-tls/tls.key -out smoke-tls/tls.crt \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          # Readable by the container's uid 201; a throwaway CI key on a read-only mount, so a
          # permissive mode costs nothing.
          chmod 0644 smoke-tls/tls.key smoke-tls/tls.crt
          {
            echo "scalar.db.saga.server.tls.enabled=true"
            echo "scalar.db.saga.server.tls.cert_chain_path=/smoke/tls.crt"
            echo "scalar.db.saga.server.tls.private_key_path=/smoke/tls.key"
          } >> smoke-tls/server.properties

      - name: Start the TLS container
        run: |
          docker run --detach --name saga-tls \
            --publish 12080:12080 --publish 12051:12051 \
            --volume "$PWD/smoke-tls:/smoke:ro" \
            scalardb-saga-server:ci --config /smoke/server.properties

      - name: Wait for the HTTPS health endpoint
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            # The substitution lives inside the `if` condition, same shape as the plaintext wait
            # above: a refused connection or unfinished handshake (inevitable while the container
            # boots) must read as a falsy poll, not a `set -e` exit. As a bare assignment, curl's
            # nonzero exit would kill the step on the first poll.
            if [ "$(curl -s --cacert smoke-tls/tls.crt -o /dev/null -w '%{http_code}' https://127.0.0.1:12080/health)" = "200" ]; then
              echo "GET /health returned 200 over TLS"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' saga-tls)" != "true" ]; then
              echo "::error::TLS container exited before becoming healthy"
              exit 1
            fi
            sleep 2
          done
          echo "::error::https /health did not return 200 within 120s"
          exit 1

      # A real gRPC health call, unlike the plaintext boot's bare TCP connect: a TLS listener
      # accepts any TCP connect, so only a completed handshake plus a served RPC proves the gRPC
      # transport is actually serving TLS. The binary is checksum-verified before it runs: GitHub
      # release assets are mutable, so the version pin alone proves nothing about the bytes.
      # Version and checksum rotate together (Dependabot cannot bump this pair).
      - name: Check gRPC health over TLS
        run: |
          set -euo pipefail
          curl -sSL -o grpc-health-probe \
            https://github.com/grpc-ecosystem/grpc-health-probe/releases/download/v0.4.28/grpc_health_probe-linux-amd64
          echo "4b818d540683b1b97256c84714a51a095e54f19792b3d7f02ac78814be645a96  grpc-health-probe" \
            | sha256sum -c -
          chmod +x grpc-health-probe
          ./grpc-health-probe -addr 127.0.0.1:12051 \
            -tls -tls-ca-cert smoke-tls/tls.crt -tls-server-name localhost

      # The positive TLS confirmation the server logs at boot, plus the same DEBUG-flood guard as
      # the plaintext boot — which under TLS also covers the handshake-noise policy.
      - name: Check TLS startup logging
        run: |
          set -euo pipefail
          logs=$(docker logs saga-tls 2>&1)
          if ! grep -q "TLS enabled for HTTP and gRPC" <<<"${logs}"; then
            echo "::error::TLS confirmation line missing from the container logs"
            exit 1
          fi
          if grep -q " DEBUG " <<<"${logs}"; then
            echo "::error::TLS container logged at DEBUG"
            exit 1
          fi

      # close_notify/GOAWAY ride the same drain as plaintext; assert it stays clean under TLS.
      - name: Check graceful shutdown over TLS
        run: |
          set -euo pipefail
          docker stop --timeout 60 saga-tls
          if ! docker logs saga-tls 2>&1 | grep -q "SagaServer stopped"; then
            echo "::error::no clean shutdown line from the TLS container"
            exit 1
          fi

      - name: Container logs
        if: failure()
        run: |
          docker logs saga 2>&1 || true
          docker logs saga-tls 2>&1 || true

  # The defect this packaging is most exposed to is invisible to the job above: only the linux-x86_64
  # epoll native arrives transitively, so a missing linux-aarch_64 dependency produces an arm64 image
  # that starts, answers /health, logs nothing unusual, and quietly runs the gRPC transport on NIO.
  # Seeing that requires actually running arm64. GitHub's hosted arm64 runners are not available to
  # private repositories on the standard plan, so this emulates, which is slow — hence a job that
  # boots the image and checks the one thing amd64 cannot show, rather than repeating the
  # architecture-independent assertions above.
  image-arm64-native-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Assemble the Docker build context
        run: ./gradlew :server:dockerContext

      # Registers binfmt handlers so the arm64 image can both build and run on an amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the arm64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: server/build/docker
          platforms: linux/arm64
          load: true
          tags: scalardb-saga-server:ci-arm64
          build-args: |
            IMAGE_VERSION=ci
            IMAGE_REVISION=${{ github.sha }}

      - name: Start the container
        run: |
          docker run --detach --name saga-arm64 --platform linux/arm64 \
            --publish 12080:12080 \
            --volume "$PWD/.github/smoke:/smoke:ro" \
            scalardb-saga-server:ci-arm64 --config /smoke/server.properties

      # A far longer budget than the native job: every instruction the JVM executes is translated, and
      # startup is the translation-heavy phase.
      - name: Wait for the REST health endpoint
        run: |
          set -euo pipefail
          for _ in $(seq 1 150); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:12080/health)" = "200" ]; then
              echo "GET /health returned 200"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' saga-arm64)" != "true" ]; then
              echo "::error::container exited before becoming healthy"
              exit 1
            fi
            sleep 2
          done
          echo "::error::/health did not return 200 within 300s"
          exit 1

      # The point of the whole job. Asserting aarch_64 specifically: the x86_64 artifact is present in
      # the same image and cannot load here, so matching the bare library name would pass on a fallback
      # that never touched the arm64 native at all.
      - name: Check the arm64 epoll native transport loaded
        run: |
          set -euo pipefail
          if ! docker exec saga-arm64 grep -q libnetty_transport_native_epoll_aarch_64 /proc/1/maps; then
            echo "::error::arm64 epoll native transport is not loaded; gRPC silently fell back to NIO"
            docker exec saga-arm64 grep -o 'libnetty[a-z0-9_]*' /proc/1/maps ||
              echo "no netty native mapped"
            exit 1
          fi

      - name: Container logs
        if: failure()
        run: docker logs saga-arm64 2>&1 || true
