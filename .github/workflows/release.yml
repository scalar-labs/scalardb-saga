name: Release

# Tags only, deliberately: every job below derives the version from the tag, and a manual dispatch on
# a branch would have no version to derive or verify. Cut a release by tagging a commit that already
# carries the release version in gradle.properties.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

# Least privilege by default; the two jobs that need to write somewhere widen it themselves.
permissions:
  contents: read

# Never cancel a release in flight — a half-uploaded Maven Central deployment or a partially pushed
# manifest list is worse than a duplicate run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Guards the one mistake this pipeline cannot undo. A released Maven Central version is immutable,
  # so publishing a jar whose internal version disagrees with the tag would be permanent. Deriving the
  # version from the tag (as some of our other repos do) hides that mismatch instead of catching it.
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check the tag against gradle.properties
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' gradle.properties)
          tag="${GITHUB_REF#refs/tags/}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if [ -z "${version}" ]; then
            echo "::error::no version= line found in gradle.properties"
            exit 1
          fi
          if [ "v${version}" != "${tag}" ]; then
            echo "::error::tag ${tag} does not match gradle.properties version ${version} (expected v${version})"
            exit 1
          fi
          case "${version}" in
            *-SNAPSHOT)
              echo "::error::refusing to release a SNAPSHOT version (${version})"
              exit 1
              ;;
          esac
          echo "Releasing ${version}"

  # Uploads one aggregated deployment covering api, core, rpc, grpc-client, and the BOM. It is left in
  # the Central Portal's VALIDATED state on purpose: releasing is a deliberate click, because a
  # released version can never be replaced or withdrawn.
  publish-maven:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Publish to Maven Central
        # The plugin reads all four as Gradle properties; ORG_GRADLE_PROJECT_* is how they arrive
        # without ever being written to a file on disk.
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache

  publish-image:
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for cosign's keyless signing, which exchanges this job's OIDC identity for a
      # certificate instead of relying on a long-lived signing key held in a secret.
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      # Gradle builds the distribution and assembles the context; Docker only packages it. Building
      # inside the Dockerfile instead would re-resolve every dependency per architecture and throw
      # away the Gradle cache this runner already has.
      - name: Assemble the Docker build context
        run: ./gradlew :daemon:dockerContext

      # The arm64 leg has to execute the Dockerfile's apt and useradd steps, which are native
      # instructions — hence emulation. The payload itself is architecture-independent Java, so this
      # only pays for a handful of package operations. If the emulated leg becomes slow enough to
      # matter, the faster arrangement is a matrix over ubuntu-latest and ubuntu-24.04-arm that pushes
      # by digest, plus a job that merges them into one manifest list.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/scalar-labs/scalardb-saga-daemon
          # `latest` follows the tag being built, so releasing a patch on an older line would move it
          # backwards. Fine while one line is active; revisit when maintaining two.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ !contains(needs.verify-version.outputs.version, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: daemon/build/docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            IMAGE_VERSION=${{ needs.verify-version.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
          # An SBOM and a max-detail provenance attestation, both attached to the image in the
          # registry. This is what lets a consumer answer "what is in this image and what built it"
          # without trusting a separate document.
          sbom: true
          provenance: mode=max

      # A signature over the image digest, verifiable with
      #   cosign verify ghcr.io/scalar-labs/scalardb-saga-daemon@<digest> \
      #     --certificate-identity-regexp='^https://github.com/scalar-labs/scalardb-saga/' \
      #     --certificate-oidc-issuer=https://token.actions.githubusercontent.com
      # Keyless, so there is no signing key to leak or rotate — the attestation is bound to this
      # workflow's identity.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        run: cosign sign --yes "ghcr.io/scalar-labs/scalardb-saga-daemon@${{ steps.build.outputs.digest }}"

  # The distribution archives, for anyone running the daemon outside a container. Runs last so the
  # release page never advertises artifacts that failed to publish.
  github-release:
    needs: [verify-version, publish-maven, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Build the distribution archives
        run: ./gradlew :daemon:distTar :daemon:distZip

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            daemon/build/distributions/*
