name: Publish snapshot

# Every commit on main and on each version branch publishes a snapshot, so downstream work can track
# either trunk or a maintenance line between releases without waiting for a tag or building locally.
# The patterns match the unprefixed branch names described in RELEASING.md: `1` for a major version
# branch, `1.0` for a minor one.
on:
  push:
    branches:
      - main
      - "[0-9]+"
      - "[0-9]+.[0-9]+"

permissions:
  contents: read

# Serialize snapshot publications per branch: a run uploads several module publications and their
# Maven metadata independently, so cancelling one midway can leave Central holding a partial snapshot
# until the next run succeeds. Let the in-flight publish finish instead. Queued runs still collapse to
# the newest commit, since GitHub keeps only the most recent pending run per group.
#
# The group is keyed by branch rather than shared, because each branch publishes a different version.
# A single shared group would let a push to one branch evict another branch's still-pending
# publication, and that snapshot would then be missing until the next commit on that branch.
concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Because the concurrency group above never cancels, a hung upload would hold it for GitHub's
    # default six hours and every snapshot behind it would wait that long. Bound the job instead.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Between the commit that sets the release version and the next development bump, a release
      # branch carries a released version rather than a snapshot. Publishing that to the snapshot
      # repository would be a no-op at best and confusing at worst, so skip rather than fail.
      - name: Check that the version is a snapshot
        id: snapshot
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' gradle.properties)
          case "${version}" in
            *-SNAPSHOT) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::notice::version ${version} is not a snapshot; nothing to publish"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Publish to the Maven Central snapshot repository
        if: steps.snapshot.outputs.publish == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache
