name: Publish snapshot

# Every commit on main publishes a snapshot, so downstream work can consume the engine between
# releases without waiting for a tag or building locally.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Snapshots are disposable and only the newest one matters, so superseding an in-flight run is fine —
# the opposite of the release workflow.
concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      # Immediately after a release, main still carries the released version until the next
      # development bump. Publishing that to the snapshot repository would be a no-op at best and
      # confusing at worst, so skip rather than fail.
      - name: Check that the version is a snapshot
        id: snapshot
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' gradle.properties)
          case "${version}" in
            *-SNAPSHOT) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::notice::version ${version} is not a snapshot; nothing to publish"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Publish to the Maven Central snapshot repository
        if: steps.snapshot.outputs.publish == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache
