# Configuration for the image smoke tests, mounted read-only at /smoke. A SQLite store and one
# definition, so the daemon has everything it needs to reach a serving state with no external
# dependencies. Shared by both smoke jobs so neither can drift into testing a different daemon.
#
# The SQLite file lives in the container's writable /tmp rather than on the read-only mount.
# WAL because that is what we tell anyone running on SQLite to use: readers stop blocking
# writers, which is what a single-writer file store otherwise makes of concurrent sagas.
scalar.db.storage=jdbc
scalar.db.contact_points=jdbc:sqlite:/tmp/smoke.db?busy_timeout=10000&journal_mode=WAL
scalar.db.saga.store.num_buckets=1

# No definitions_path or services_path: every smoke boot mounts the two directories at the image's
# conventional paths (/scalardb-saga/conf/definitions and /scalardb-saga/conf/services) and relies
# on the defaults, so a default drifting from the Dockerfile's layout fails here. The payment
# service is deliberately unreachable: the saga is never started, and registration only has to
# resolve the name.

# The daemon refuses to start under the noop provider on a non-loopback interface without this, and a
# smoke test has no IdP to authenticate against.
scalar.db.saga.server.security.insecure_mode.enabled=true
