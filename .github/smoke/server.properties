# Configuration for the image smoke tests, mounted read-only over /scalardb-saga/conf, the image's
# conventional layout and the README's documented docker run. A SQLite store and one definition,
# so the daemon has everything it needs to reach a serving state with no external dependencies.
# Shared by both smoke jobs so neither can drift into testing a different daemon.
#
# The SQLite file lives in the container's writable /tmp rather than on the read-only mount.
# WAL because that is what we tell anyone running on SQLite to use: readers stop blocking
# writers, which is what a single-writer file store otherwise makes of concurrent sagas.
scalar.db.storage=jdbc
scalar.db.contact_points=jdbc:sqlite:/tmp/smoke.db?busy_timeout=10000&journal_mode=WAL
scalar.db.saga.store.num_buckets=1

# No definitions_path, services_path, or tls.* key: the mount above puts definitions/ and services/
# at the image's conventional paths (and, for the TLS boot, the certificate pair under tls/server/),
# so every boot relies on the defaults and a default drifting from the documented layout fails here.
# The payment service is deliberately unreachable: the saga is never started, and registration only
# has to resolve the name.

# The daemon refuses to start under the noop provider on a non-loopback interface without this, and a
# smoke test has no IdP to authenticate against.
scalar.db.saga.server.security.insecure_mode.enabled=true
