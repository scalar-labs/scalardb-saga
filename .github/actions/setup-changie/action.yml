name: Set up changie
description: >-
  Puts changie (https://changie.dev) on the PATH for linux/amd64, verified against the checksum
  pinned here. Shared by changelog.yml and release.yml.

# Downloaded rather than taken from a marketplace action, so the binary is checked against a digest
# this repository pins. Dependabot does not see a version written here: to bump it, take the new
# release's `changie_<version>_linux_amd64.tar.gz` line from its checksums.txt and change both
# values together.
runs:
  using: composite
  steps:
    - name: Install changie
      shell: bash
      env:
        CHANGIE_VERSION: 1.26.0
        CHANGIE_SHA256: eab168c8287a6e91912e1c02e5260911232d945bfd3c89d8a0e1ace6bb7b6161
      run: |
        set -euo pipefail
        archive="changie_${CHANGIE_VERSION}_linux_amd64.tar.gz"
        dir="${RUNNER_TEMP}/changie"
        mkdir -p "${dir}"
        curl -fsSL -o "${dir}/${archive}" \
          "https://github.com/miniscruff/changie/releases/download/v${CHANGIE_VERSION}/${archive}"
        echo "${CHANGIE_SHA256}  ${dir}/${archive}" | sha256sum -c -
        tar -xzf "${dir}/${archive}" -C "${dir}" changie
        echo "${dir}" >> "${GITHUB_PATH}"
