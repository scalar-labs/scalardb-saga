version: 2

updates:
  # The version catalog (gradle/libs.versions.toml) and the convention-plugin dependencies in
  # build-logic. Dependabot understands the catalog format, so a bump lands in one place.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # These move together and are only ever exercised by the build itself, so reviewing them as one
      # PR is both safer and less noise than one PR each. Every build tool belongs here: a plugin that
      # matches nothing takes a slot of the limit above on its own, which is what the limit is meant to
      # keep free for real dependency updates.
      build-tooling:
        patterns:
          - "com.diffplug.spotless*"
          - "com.github.jk1*"
          - "com.github.spotbugs*"
          - "com.google.errorprone*"
          # The exact coordinate rather than a com.google.protobuf* glob, which would also take
          # protobuf-java — a runtime dependency, and one that wants reviewing on its own.
          - "com.google.protobuf:protobuf-gradle-plugin"
          - "com.h3xstream.findsecbugs*"
          - "com.uber.nullaway*"
          - "com.vanniktech*"
          - "net.ltgt.gradle*"
      # gRPC ships its modules as a set and the BOM must match the stubs.
      grpc:
        patterns:
          - "io.grpc*"
      # Netty must stay on a single version across every module — see the netty entry in
      # libs.versions.toml — so its BOM can only be bumped as a unit.
      netty:
        patterns:
          - "io.netty*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # Keeps the digest-pinned base image in the daemon Dockerfile current. Without this the pin would
  # quietly rot, and the image would ship an ever-older Ubuntu and JRE.
  - package-ecosystem: docker
    directory: /daemon/docker
    schedule:
      interval: weekly

  # Every entry above targets the default branch only. A minor version branch receives nothing until
  # it is named by a `target-branch`, so a maintained line would otherwise sit on frozen dependencies
  # for its whole life. When a release branch is cut, add a copy of each entry above naming it, and
  # delete those copies when that line reaches end of life. Entries naming a branch that does not yet
  # exist produce errors, which is why they are not written ahead of time.
  #
  # Step 1 of RELEASING.md says how: copy the entries above on the default branch and give each copy a
  # target-branch. There is deliberately no commented-out template here, and no second copy of these
  # entries in RELEASING.md either. Both have to be re-indented as they are pasted, and an off-by-two
  # leaves a block sequence whose items do not line up. That does not disable one entry; it makes the
  # whole file unparseable, which stops every update on every branch at once, silently.
  #
  # Known limitation: Dependabot *security* updates only ever target the default branch. An entry with
  # `target-branch` produces version updates alone, so a CVE fix still has to be backported by hand.
