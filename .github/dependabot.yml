version: 2

updates:
  # The version catalog (gradle/libs.versions.toml) and the convention-plugin dependencies in
  # build-logic. Dependabot understands the catalog format, so a bump lands in one place.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # These move together and are only ever exercised by the build itself, so reviewing them as one
      # PR is both safer and less noise than one PR each. Every build tool belongs here: a plugin that
      # matches nothing takes a slot of the limit above on its own, which is what the limit is meant to
      # keep free for real dependency updates.
      build-tooling:
        patterns:
          - "com.diffplug.spotless*"
          - "com.github.jk1*"
          - "com.github.spotbugs*"
          - "com.google.errorprone*"
          # The exact coordinate rather than a com.google.protobuf* glob, which would also take
          # protobuf-java — a runtime dependency, and one that wants reviewing on its own.
          - "com.google.protobuf:protobuf-gradle-plugin"
          - "com.h3xstream.findsecbugs*"
          - "com.uber.nullaway*"
          - "com.vanniktech*"
          - "net.ltgt.gradle*"
          - "org.gradle.toolchains*"
      # gRPC ships its modules as a set and the BOM must match the stubs.
      grpc:
        patterns:
          - "io.grpc*"
      # Netty must stay on a single version across every module — see the netty entry in
      # libs.versions.toml — so its BOM can only be bumped as a unit.
      netty:
        patterns:
          - "io.netty*"

  # `/` covers only .github/workflows; the composite actions under .github/actions are listed
  # separately, or the actions they call would never be bumped.
  # hadolint-action is kept out of the group and arrives as its own PR: the action's image pins the
  # hadolint version, so a bump of it is a bump of the linter, and one whose new rules fail the
  # dockerfile-lint job would otherwise hold every other action's update hostage in the same PR.
  # It does not get a one-member group of its own, for the reason given on the docker entry below.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "hadolint/hadolint-action"

  # Keeps the digest-pinned base image in the server Dockerfile current. Without this the pin would
  # quietly rot, and the image would ship an ever-older Ubuntu and JRE. When a Dockerfile is added
  # anywhere else, list its directory here and in every docker entry of the release-branch section
  # below: Dependabot reads nothing it is not pointed at. There is no `groups:` block while this is
  # the only Dockerfile: a group with one member only replaces "bump eclipse-temurin from X to Y" in
  # the PR title with the name of the group. Add one as soon as a second Dockerfile is listed, so a
  # base-image respin stays one PR per branch instead of one per directory.
  - package-ecosystem: docker
    directories: ["/server/docker"]
    schedule:
      interval: weekly
    ignore:
      # Only the LTS majors (21, 25, ...) keep receiving patches; the six-month interim releases die
      # the moment the next one ships, so a major bump would usually land the image on an
      # already-dead JRE. Moving to the next LTS is a deliberate manual change. The digest updates
      # that deliver each security rebuild of the current tag are a different update type, which this
      # rule does not touch.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  # --- Release branches: github-actions and docker ---
  # Gradle bumps deliberately have no target-branch copies: they land on main once and reach the
  # release lines as Auto-PR cherry-pick backports (.github/workflows/auto-pr.yml), driven by the
  # family-shared "ScalarDB <version>" projects attached to the merged PR — the same model the other
  # Scalar repositories use. One bump, one review, per-line backport PRs generated on merge.
  # Two ecosystems are the exception, and each line keeps its own entry for them instead:
  # - Workflow files drift between lines (each branch's CI evolves separately), so a cherry-pick of a
  #   workflow bump conflicts more often than it applies.
  # - The base image is per-line state. A line stays on the JRE major and Ubuntu code name it
  #   released with (3.19 sat on Temurin 21 while main was already on 25), so main's digest bump
  #   names a tag the line does not use and is nothing a cherry-pick can carry across; and the
  #   security rebuilds of the line's own tag only ever reach it through an entry that resolves
  #   that tag. Each docker entry repeats the main entry's ignore rule, for the same reason.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    target-branch: "3"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "hadolint/hadolint-action"

  - package-ecosystem: docker
    directories: ["/server/docker"]
    target-branch: "3"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    target-branch: "3.20"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "hadolint/hadolint-action"

  - package-ecosystem: docker
    directories: ["/server/docker"]
    target-branch: "3.20"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  # The entries without a `target-branch` cover the default branch; the github-actions and docker
  # blocks after them cover one release branch each. A version branch receives no workflow or
  # base-image updates until it is named by a `target-branch`, so when a release branch is cut, add
  # a copy of the github-actions entry and of the docker entry naming it (the family-shared
  # "ScalarDB <version>" project for the line normally already exists, created by the ScalarDB
  # release cycle, so gradle bumps reach it as backports) — and delete both blocks again when the
  # line reaches end of life.
  # Entries naming a branch that does not yet exist produce errors, which is why they are not
  # written ahead of time. Re-indent as you paste: an off-by-two does not disable one entry, it
  # makes the whole file unparseable, which stops every update on every branch at once, silently.
  #
  # Known limitation: Dependabot *security* updates only ever target the default branch. That is
  # now the working model rather than a gap — the security bump merges on main and its backport PRs
  # carry it to every line whose project is attached. The base image has nothing to miss here:
  # the advisory database covers no Docker ecosystem, so no security update ever targets a
  # Dockerfile, on main or anywhere else. What keeps a line's base image patched is the digest
  # rebuild of its tag, which the per-branch entries deliver as that line's version update.
