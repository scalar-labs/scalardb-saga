# ScalarDB Saga daemon configuration — TEMPLATE.
#
# The image ships this file at /scalardb-saga/conf/server.properties and passes it to the daemon as
# its only argument. As shipped it does NOT start: there is no reachable database and no saga
# definition, both of which the daemon requires. Replace it by mounting over /scalardb-saga/conf, or
# point the daemon at another path by overriding the container command.
#
# Every key below is documented on SagaServerConfig. Any value in the scalar.db.saga.* namespace may
# use a secret reference — ${env:NAME} or ${file:UTF-8:/path} (a mounted Kubernetes Secret) — which is
# resolved at startup. Keys in the plain scalar.db.* namespace are resolved by ScalarDB itself, which
# supports ${env:...} but NOT ${file:...}.

# --- ScalarDB store (required) -----------------------------------------------------------------
# Where the daemon persists saga state. This is the durable record of every in-flight saga, so it
# must be a real, backed-up database — not ephemeral container storage.
scalar.db.storage=jdbc
scalar.db.contact_points=jdbc:postgresql://REPLACE_ME:5432/scalardb
scalar.db.username=${env:SCALAR_DB_USERNAME}
scalar.db.password=${env:SCALAR_DB_PASSWORD}

# --- Saga definitions (required) ---------------------------------------------------------------
# A file or directory of JSON/YAML saga definitions, loaded once at startup. The daemon refuses to
# start with none registered, rather than serving a healthy but useless process. Daemon mode is
# declarative-only: a definition naming a code step (stepClass) is rejected, since an operator cannot
# add classes to this image.
scalar.db.saga.server.definitions_path=/scalardb-saga/conf/definitions

# --- Transports -------------------------------------------------------------------------------
# Both are enabled by default; disabling one leaves its port unbound. At least one must stay enabled.
scalar.db.saga.server.host=0.0.0.0
scalar.db.saga.server.port=8080
scalar.db.saga.server.grpc_port=50051
# scalar.db.saga.server.http_enabled=true
# scalar.db.saga.server.grpc_enabled=true

# --- Security (configure before exposing the daemon) -------------------------------------------
# The default provider is `noop`, which authenticates nothing. Because host is 0.0.0.0 above, the
# daemon REFUSES TO START under `noop` unless insecure_mode.enabled is set — a deliberate guard
# against an unauthenticated coordinator on a reachable interface. Set a real provider here.
scalar.db.saga.server.security.provider=jwt
# scalar.db.saga.server.security.insecure_mode.enabled=true

# --- Services a declarative step calls ---------------------------------------------------------
# One entry per service named by a definition's "service" field. Repeat per service.
# scalar.db.saga.server.service.payment.base_url=http://payment:8080

# --- Bounds -----------------------------------------------------------------------------------
# Left at defaults; see SagaServerConfig for the reasoning behind each.
# scalar.db.saga.server.sync_max_wait_millis=60000
# scalar.db.saga.server.default_saga_timeout_millis=0
# scalar.db.saga.server.max_start_requests_per_minute=0
# scalar.db.saga.server.max_threads=200
