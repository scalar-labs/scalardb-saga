# ScalarDB Saga server configuration for the getting-started example.
#
# Mounted at /scalardb-saga/conf/server.properties by docker-compose.yaml. Every key is documented
# on SagaServerConfig; see server/docker/README.md for the ones that matter in a real deployment.

# --- ScalarDB store ----------------------------------------------------------------------------
# Where saga state is persisted. The saga tables are created on first start.
scalar.db.storage=jdbc
scalar.db.contact_points=jdbc:postgresql://postgres:5432/scalardb
scalar.db.username=scalardb
scalar.db.password=scalardb
# ScalarDB's one-phase commit: a transaction whose writes the storage can apply atomically in one
# operation commits without the separate coordinator write.
scalar.db.consensus_commit.one_phase_commit.enabled=true

# --- Saga definitions and participant services -------------------------------------------------
# Neither directory needs a key: docker-compose.yaml mounts ./conf at /scalardb-saga/conf, and the
# server reads definitions/ and services/ there by default. One <name>.properties file per
# definition "service" name lives in services/; each file's base_url is a Compose service name,
# resolved on the Compose network. The server refuses to start with no definition registered.

# --- Recovery ----------------------------------------------------------------------------------
# Tuned for the demo: a saga whose updated_at is older than 20s is considered abandoned, and the
# scan looks every 10s — so order-saga-pivot's roll-forward happens 20-30 seconds after its
# retries exhaust, instead of the production default of a minute and a half. The dashboard's pace
# is capped at 2s per call so a slow-paced saga can never look abandoned inside this window.
scalar.db.saga.server.recovery.staleness_threshold_millis=20000
scalar.db.saga.server.recovery.interval_seconds=10

# --- Security ----------------------------------------------------------------------------------
# LOCAL EXAMPLE ONLY. The default security provider authenticates nothing, so the server refuses to
# start on a reachable interface unless insecure mode is explicitly enabled — this line is that
# acknowledgement. Never set it on a deployment anyone else can reach: configure
# scalar.db.saga.server.security.provider (api-key or jwt) instead.
scalar.db.saga.server.security.insecure_mode.enabled=true
