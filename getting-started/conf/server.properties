# ScalarDB Saga server configuration for the getting-started example.
#
# Mounted at /scalardb-saga/conf/server.properties by docker-compose.yaml. Every key is documented
# on SagaServerConfig; see server/docker/README.md for the ones that matter in a real deployment.

# --- ScalarDB store ----------------------------------------------------------------------------
# Where saga state is persisted. The saga tables are created on first start.
scalar.db.storage=jdbc
scalar.db.contact_points=jdbc:postgresql://postgres:5432/scalardb
scalar.db.username=scalardb
scalar.db.password=scalardb

# --- Saga definitions --------------------------------------------------------------------------
# Loaded once at startup. The server refuses to start with none registered.
scalar.db.saga.server.definitions_path=/scalardb-saga/conf/definitions

# --- Participant services ----------------------------------------------------------------------
# The base URL behind each definition's "service" name. These are Compose service names, resolved
# on the Compose network.
scalar.db.saga.server.service.payment.base_url=http://payment:8080
scalar.db.saga.server.service.inventory.base_url=http://inventory:8080
scalar.db.saga.server.service.shipping.base_url=http://shipping:8080

# --- Security ----------------------------------------------------------------------------------
# LOCAL EXAMPLE ONLY. The default security provider authenticates nothing, so the server refuses to
# start on a reachable interface unless insecure mode is explicitly enabled — this line is that
# acknowledgement. Never set it on a deployment anyone else can reach: configure
# scalar.db.saga.server.security.provider (api-key or jwt) instead.
scalar.db.saga.server.security.insecure_mode.enabled=true
