name: scalardb-saga-getting-started

services:
  # Where the saga server keeps its state. Any database ScalarDB supports works here; PostgreSQL
  # needs no extra driver, and the saga tables are created on first start.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scalardb
      POSTGRES_USER: scalardb
      POSTGRES_PASSWORD: scalardb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scalardb -d scalardb"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The three participants the saga calls. All three run the same script; SERVICE_NAME decides which
  # one a container is. Nothing is built — the script is mounted into a stock Python image.
  payment:
    image: python:3.13-slim
    command: ["python", "/service.py"]
    environment:
      SERVICE_NAME: payment
      EVENT_SINK_URL: http://dashboard:12090/feed
    volumes:
      - ./services/service.py:/service.py:ro

  inventory:
    image: python:3.13-slim
    command: ["python", "/service.py"]
    environment:
      SERVICE_NAME: inventory
      EVENT_SINK_URL: http://dashboard:12090/feed
    volumes:
      - ./services/service.py:/service.py:ro

  shipping:
    image: python:3.13-slim
    command: ["python", "/service.py"]
    environment:
      SERVICE_NAME: shipping
      # /ship succeeds; /ship-fail answers 422 so order-saga-failing has something to compensate;
      # /ship-flaky answers 503 twice per saga so order-saga-flaky has something to retry;
      # /ship-fail-retryable always answers 503 so order-saga-retry-failing exhausts its retries.
      # The tcc variants fail the same ways in TCC's two phases: a rejected reservation
      # (order-tcc-try-fail) and a flaky confirmation (order-tcc-confirm-retry).
      FAIL_PATHS: /ship-fail,/tcc/shipping/reserve-fail
      FAIL_RETRYABLE_PATHS: /ship-fail-retryable
      FLAKY_PATHS: /ship-flaky,/tcc/shipping/confirm-flaky
      EVENT_SINK_URL: http://dashboard:12090/feed
    volumes:
      - ./services/service.py:/service.py:ro

  saga-server:
    # The default names the newest published image. The release workflow asserts that it matches the
    # version being released, so a stale default fails the release rather than reaching a reader.
    image: ghcr.io/scalar-labs/scalardb-saga-server:${SAGA_VERSION:-3.19.0-alpha.1}
    ports:
      - "12080:12080" # REST
      - "12051:12051" # gRPC
    volumes:
      - ./conf:/scalardb-saga/conf:ro
    # No healthcheck: this image ships a JRE and nothing else, so there is no HTTP client in it to
    # probe /health with. saga-server-ready below is that probe, from a container that has curl.
    depends_on:
      postgres:
        condition: service_healthy
      payment:
        condition: service_started
      inventory:
        condition: service_started
      shipping:
        condition: service_started

  # The stack's readiness gate, and the reason it is a container of its own: a Compose healthcheck
  # only ever runs inside the container it belongs to, and nothing inside the saga server's image can
  # call its own /health. This holds `docker compose up -d --wait` until the server is really
  # serving; without it `up -d` returns as soon as the containers start and the first request loses a
  # race with schema creation and definition loading. It idles for the rest of the run.
  saga-server-ready:
    image: curlimages/curl
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://saga-server:12080/health"]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      saga-server:
        condition: service_started

  # The live dashboard: a web page on http://localhost:12090 that shows sagas executing in
  # realtime. It only reads the saga server's REST API (and relays it to the browser), so the
  # walkthrough works exactly the same without it. Like the participants, nothing is built — the
  # stock Python image runs the mounted script.
  dashboard:
    image: python:3.13-slim
    command: ["python", "/dashboard/server.py"]
    ports:
      - "12090:12090"
    environment:
      SAGA_SERVER_URL: http://saga-server:12080
      # Where the pace slider's value is registered when a saga starts, so the participants know
      # how long to hold that saga's calls.
      PARTICIPANT_URLS: http://payment:8080,http://inventory:8080,http://shipping:8080
    volumes:
      - ./dashboard:/dashboard:ro
      - ./conf/definitions:/definitions:ro
    # Unhealthy whenever the saga server is unreachable: a dashboard that reported healthy while it
    # could not read the API it exists to display would be lying. The stack's startup gate is
    # saga-server-ready above, not this. A Python one-liner because this image ships no curl either.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:12090/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      saga-server-ready:
        condition: service_healthy
